name: update

on:
  schedule:
    - cron: "15 6 * * *"          # daily 06:15 UTC; stories are refit on Mondays
  workflow_dispatch:
    inputs:
      days:
        description: "Days of news to fetch at least (2 = daily; each firm also catches up to its last stored article)"
        default: "2"
      refit:
        description: "Refit the stories now"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt     # embeddings come from OpenRouter: no torch needed

      - name: Restore embedding cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: emb-${{ github.run_id }}
          restore-keys: emb-

      - name: Fetch news
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python pipeline/fetch.py --days "${{ inputs.days || '2' }}"

      - name: Build stories
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # required: embeddings and story names
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}    # repo variable; unset = deepseek/deepseek-v4.1-flash
          EMBED_MODEL: ${{ vars.EMBED_MODEL }}              # repo variable; unset = openrouter:google/gemini-embedding-2
        run: |
          if [ "${{ inputs.refit }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then
            python pipeline/build.py --refit
          else
            python pipeline/build.py
          fi

      - name: Commit data
        run: |
          git config user.name "narratives-bot"
          git config user.email "narratives-bot@users.noreply.github.com"
          git add data/raw data/state site/data
          if ! git diff --cached --quiet; then
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase origin "${GITHUB_REF_NAME}"      # someone may have pushed during the run
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
